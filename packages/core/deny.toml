# cargo-deny config. W1 (phase 4f, judgment-day): `advisories`/`bans`/
# `sources` are now explicit sections (previously left at cargo-deny's
# built-in defaults, undocumented in this file) and wired into CI alongside
# `licenses` — `cargo deny check` (no subcommand filter) runs ALL FOUR.
# Verified locally first (per the orchestrator instruction "enable ... if
# they pass"): `cargo deny check advisories bans sources` passes clean with
# this crate's one dependency (`wasm-bindgen`) and its transitive tree.

[advisories]
# RUSTSEC database checks (unmaintained/yanked/vulnerable crates). This
# crate's dependency tree is tiny (wasm-bindgen + its own small deps) and
# currently has zero known advisories — `deny` (not `warn`) so a newly
# disclosed advisory fails CI instead of silently passing.
yanked = "deny"

[bans]
# `multiple-versions = "warn"` (not "deny"): wasm-bindgen's own transitive
# deps (e.g. `wasm-bindgen-macro`/`wasm-bindgen-shared`) are versioned in
# lockstep by that project, not something this crate controls — denying
# would make an unrelated upstream release block this crate's CI.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io — no git/path dependency sources, consistent with D6's
# "no serde at the boundary, wasm-bindgen is the only dependency" scope.
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Permissive licenses this crate and its dependency tree may use.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
]
# GPL/AGPL (and anything else not explicitly allowed above) are denied by
# cargo-deny's default `unlicensed = "deny"` / unmatched-license behavior —
# no copyleft license may enter this crate's dependency tree.
confidence-threshold = 0.8
